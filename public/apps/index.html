<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Apps — The JPMoreGain Project</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,300;1,6..72,400;1,6..72,500&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root{
  --paper:#f3ede1; --paper-2:#ece4d4; --card:#fbf7ee;
  --ink:#1d1813; --ink-2:#4d453a; --muted:#857a69;
  --line:rgba(29,24,19,.14); --line-2:rgba(29,24,19,.30);
  --shadow:0 30px 60px -28px rgba(40,30,16,.45);
  --serif:"Newsreader",Georgia,serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
html[data-theme="dark"]{
  --paper:#15120d; --paper-2:#1b1711; --card:#1d1812;
  --ink:#efe7d7; --ink-2:#c3b8a3; --muted:#8d8270;
  --line:rgba(239,231,215,.13); --line-2:rgba(239,231,215,.26);
  --shadow:0 36px 70px -30px rgba(0,0,0,.7);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background-color:var(--paper); color:var(--ink); font-family:var(--serif);
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
::selection{background:var(--ink);color:var(--paper)}
a{color:inherit;text-decoration:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 clamp(20px,5vw,64px)}
.mono{font-family:var(--mono);font-weight:500;letter-spacing:.04em}
.k{font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}

/* ---------- top bar ---------- */
.bar{position:sticky;top:0;z-index:50;background:color-mix(in oklab,var(--paper) 86%,transparent);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar-in{display:flex;align-items:center;justify-content:space-between;height:60px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--ink);display:inline-block}
.bar-r{display:flex;align-items:center;gap:22px}
.bar-r a.lk{font-family:var(--mono);font-size:12px;color:var(--muted);transition:color .25s}
.bar-r a.lk:hover{color:var(--ink)}
.toggle{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);
  border:1px solid var(--line-2);background:transparent;border-radius:999px;padding:7px 13px;cursor:pointer;display:flex;align-items:center;gap:7px;transition:.25s}
.toggle:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* ---------- masthead ---------- */
.mast{padding:clamp(56px,10vw,120px) 0 clamp(40px,6vw,72px);position:relative}
.dateline{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding-bottom:26px;border-bottom:1px solid var(--line)}
.dateline .rule{flex:1;height:1px;background:var(--line);min-width:30px}
.headline{font-size:clamp(46px,9.2vw,128px);line-height:.92;font-weight:400;letter-spacing:-.02em;margin:38px 0 0;text-wrap:balance}
.headline em{font-style:italic;font-weight:300}
.lede{max-width:36ch;margin-top:30px;font-size:clamp(18px,2vw,23px);line-height:1.5;color:var(--ink-2);text-wrap:pretty}
.mast-meta{margin-top:34px;display:flex;flex-wrap:wrap;gap:10px 26px}
.mast-meta span{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
.mast-meta span::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent,var(--ink-2))}

/* ---------- index ---------- */
.idx{margin:8px 0 clamp(40px,7vw,90px);border-top:1px solid var(--line)}
.idx-row{display:grid;grid-template-columns:64px 1fr auto;align-items:baseline;gap:18px;
  padding:18px 4px;border-bottom:1px solid var(--line);cursor:pointer;position:relative;transition:padding .35s ease}
.idx-row::after{content:"";position:absolute;left:0;bottom:-1px;height:1px;width:0;background:var(--rcol,var(--ink));transition:width .45s ease}
.idx-row:hover{padding-left:18px}
.idx-row:hover::after{width:100%}
.idx-num{font-family:var(--mono);font-size:13px;color:var(--muted)}
.idx-name{font-size:clamp(22px,3.4vw,38px);font-weight:400;letter-spacing:-.01em;transition:color .3s}
.idx-row:hover .idx-name{color:var(--rcol,var(--ink));font-style:italic}
.idx-name .swatch{display:inline-block;width:.5em;height:.5em;border-radius:50%;background:var(--rcol);margin-right:.5em;vertical-align:middle;opacity:0;transform:scale(0);transition:.35s}
.idx-row:hover .idx-name .swatch{opacity:1;transform:scale(1)}
.idx-tag{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}

/* ---------- entries ---------- */
.entry{padding:clamp(60px,9vw,120px) 0;border-bottom:1px solid var(--line);position:relative;scroll-margin-top:70px}
.entry-grid{display:grid;grid-template-columns:1fr minmax(280px,420px);gap:clamp(34px,6vw,84px);align-items:center}
.entry.rev .entry-grid{grid-template-columns:minmax(280px,420px) 1fr}
.entry.rev .col-text{order:2}
.entry-num{font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.2em;color:var(--rcol);display:flex;align-items:center;gap:12px;margin-bottom:22px}
.entry-num .ln{height:1px;width:46px;background:var(--rcol);opacity:.5}
.entry h2{font-size:clamp(38px,6vw,76px);line-height:.96;font-weight:400;letter-spacing:-.02em}
.entry h2 em{font-style:italic;font-weight:300}
.entry .one{font-size:clamp(19px,2.2vw,26px);font-style:italic;color:var(--ink-2);margin-top:14px;line-height:1.35;text-wrap:pretty}
.entry .long{margin-top:24px;max-width:46ch;font-size:17px;line-height:1.62;color:var(--ink-2);text-wrap:pretty}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:26px}
.chip{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  border:1px solid var(--line-2);border-radius:999px;padding:6px 12px}
.cta{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-top:34px}
.btn{display:inline-flex;align-items:center;gap:10px;font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.04em;
  padding:14px 22px;border-radius:999px;cursor:pointer;transition:transform .3s cubic-bezier(.2,.7,.3,1),box-shadow .3s,background .3s}
.btn-primary{background:var(--rcol);color:#fff;box-shadow:0 14px 30px -12px var(--rcol)}
html[data-theme="dark"] .btn-primary{color:#0c0c0c}
.btn-primary:hover{transform:translateY(-3px);box-shadow:0 22px 40px -14px var(--rcol)}
.btn-ghost{color:var(--ink);border:1px solid var(--line-2)}
.btn-ghost:hover{transform:translateY(-3px);border-color:var(--ink)}
.btn svg{width:15px;height:15px}

.col-art{position:relative;display:flex;justify-content:center}
.bg-name{position:absolute;inset:auto 0 0 0;font-family:var(--serif);font-style:italic;font-weight:300;
  font-size:clamp(80px,16vw,220px);line-height:.8;color:var(--rcol);opacity:.07;white-space:nowrap;
  text-align:center;pointer-events:none;z-index:0;user-select:none}
.entry.rev .bg-name{text-align:center}
.stage{position:relative;z-index:1}
.phone{position:relative;width:clamp(218px,24vw,300px);aspect-ratio:9/19.5;border-radius:38px;
  background:#0b0b0c;padding:9px;box-shadow:var(--shadow);transform:rotate(var(--rot,-3deg));
  transition:transform .6s cubic-bezier(.2,.7,.3,1)}
.entry.rev .phone{--rot:3deg}
.col-art:hover .phone{transform:rotate(0)}
.phone::before{content:"";position:absolute;top:13px;left:50%;transform:translateX(-50%);width:78px;height:6px;border-radius:6px;background:#26262a;z-index:3}
.phone img{width:100%;height:100%;object-fit:cover;border-radius:30px;display:block;background:#111}
.glow{position:absolute;width:120%;height:60%;left:-10%;top:18%;background:radial-gradient(60% 60% at 50% 50%,var(--rcol),transparent 70%);
  filter:blur(60px);opacity:.30;z-index:0;border-radius:50%}
html[data-theme="light"] .glow{opacity:.20}
.plate{position:absolute;z-index:2;width:74px;height:74px;border-radius:18px;overflow:hidden;
  box-shadow:0 16px 34px -14px rgba(0,0,0,.5);border:3px solid var(--card);right:-6px;bottom:18px;background:var(--card)}
.entry.rev .plate{right:auto;left:-6px}
.plate img{width:100%;height:100%;object-fit:cover}

/* ---------- footer ---------- */
.foot{padding:clamp(60px,9vw,120px) 0 60px}
.foot-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:30px;align-items:flex-end;
  padding-bottom:34px;border-bottom:1px solid var(--line)}
.foot-big{font-size:clamp(30px,5vw,58px);font-weight:400;letter-spacing:-.02em;line-height:1;max-width:18ch;text-wrap:balance}
.foot-big em{font-style:italic;font-weight:300}
.foot-links{display:flex;flex-direction:column;gap:12px;align-items:flex-end}
.foot-links a{font-family:var(--mono);font-size:13px;color:var(--ink-2);transition:.25s;display:flex;align-items:center;gap:9px}
.foot-links a:hover{color:var(--ink);gap:13px}
.colophon{margin-top:30px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:14px}
.colophon p{font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:.02em}

/* reveal */
.rv{opacity:0;transform:translateY(26px);transition:opacity 1s cubic-bezier(.2,.7,.3,1),transform 1s cubic-bezier(.2,.7,.3,1)}
.rv.in{opacity:1;transform:none}
.rv.d1{transition-delay:.08s}.rv.d2{transition-delay:.16s}.rv.d3{transition-delay:.24s}.rv.d4{transition-delay:.32s}

@media (max-width:820px){
  .entry-grid,.entry.rev .entry-grid{grid-template-columns:1fr;gap:46px}
  .entry.rev .col-text{order:0}
  .col-art{order:-1}
  .idx-tag{display:none}
  .idx-row{grid-template-columns:46px 1fr}
}
@media (prefers-reduced-motion:reduce){
  *{scroll-behavior:auto!important}
  .rv{opacity:1!important;transform:none!important;transition:none!important}
  .phone{transition:none}
}
</style>
</head>
<body>
<header class="bar">
  <div class="wrap bar-in">

</main>

<script>
(function(){
  const B=window.JPM_BRAND, A=window.JPM_APPS;
  const playIcon='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.6 2.1 13.3 12 3.6 21.9c-.4-.2-.7-.7-.7-1.3V3.4c0-.6.3-1.1.7-1.3Zm11.1 11.1 2.6 2.6-9.2 5.3 6.6-7.9Zm0-2.4L8.1 2.9l9.2 5.3-2.6 2.6ZM18.6 9.6l2.9 1.7c.7.4.7 1.4 0 1.8l-2.9 1.7L15.6 12l3-2.4Z"/></svg>';
  const arrow='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

  document.getElementById('handleLink').href=B.x;
  document.getElementById('lede').textContent=B.blurb;
  document.getElementById('voice').textContent=B.voice;
  document.getElementById('mastMeta').innerHTML=
    ['6 apps','Android · Google Play','Built solo in '+B.location,'2024 – 2026']
    .map(t=>`<span>${t}</span>`).join('');

  /* index */
  document.getElementById('index').innerHTML=A.map((a,i)=>`
    <a class="idx-row" href="#${a.slug}" style="--rcol:${a.accent}">
      <span class="idx-num">${String(i+1).padStart(2,'0')}</span>
      <span class="idx-name"><span class="swatch"></span>${a.name}</span>
      <span class="idx-tag">${a.kicker}</span>
    </a>`).join('');

  /* entries */
  document.getElementById('entries').innerHTML=A.map((a,i)=>{
    const rev=i%2===1;
    return `<section class="entry${rev?' rev':''}" id="${a.slug}" style="--rcol:${a.accent}">
      <div class="entry-grid">
        <div class="col-text">
          <div class="entry-num rv">${String(i+1).padStart(2,'0')}<span class="ln"></span>${a.kicker}</div>
          <h2 class="rv d1">${a.name}</h2>
          <p class="one rv d1">${a.one}</p>
          <p class="long rv d2">${a.long}</p>
          <div class="chips rv d2">${a.tags.map(t=>`<span class="chip">${t}</span>`).join('')}</div>
          <div class="cta rv d3">
            <a class="btn btn-primary" href="${a.play}" target="_blank" rel="noopener">${playIcon} Google Play</a>
            <a class="btn btn-ghost" href="${a.page}" target="_blank" rel="noopener">Full page ${arrow}</a>
          </div>
        </div>
        <div class="col-art rv d2">
          <div class="bg-name">${a.name.split(' ')[0]}</div>
          <div class="glow"></div>
          <div class="stage">
            <div class="phone" data-parallax><img src="${a.shots[0]}" alt="${a.name} screenshot" loading="lazy" />
              <div class="plate"><img src="${a.icon}" alt="${a.name} icon" loading="lazy" /></div>
            </div>
          </div>
        </div>
      </div>
    </section>`;
  }).join('');

  document.getElementById('footLinks').innerHTML=
    [['Google Play — all apps','#'],['@jp_moregain on X',B.x],['thejpmoregainproject.com',B.home],['About',B.home+'about']]
    .map(([t,h])=>`<a href="${h}"${h.startsWith('http')?' target="_blank" rel="noopener"':''}>${t} ${arrow}</a>`).join('');

  /* theme */
  const root=document.documentElement, icon=document.getElementById('themeIcon'), lbl=document.getElementById('themeLbl');
  function apply(t){root.setAttribute('data-theme',t);icon.textContent=t==='dark'?'◑':'◐';lbl.textContent=t==='dark'?'Light':'Dark';
    try{localStorage.setItem('jpm_fieldnotes_theme',t)}catch(e){}}
  let saved='light';try{saved=localStorage.getItem('jpm_fieldnotes_theme')||'light'}catch(e){}
  apply(saved);
  document.getElementById('themeBtn').addEventListener('click',()=>apply(root.getAttribute('data-theme')==='dark'?'light':'dark'));

  /* reveal — rect-based (robust in preview/iframe contexts where IO can stall) */
  const rvEls=[...document.querySelectorAll('.rv')];
  function revealCheck(){
    const vh=innerHeight;let t=false;
    rvEls.forEach(el=>{if(el.classList.contains('in'))return;
      const r=el.getBoundingClientRect();
      if(r.top<vh*0.92&&r.bottom>0){el.classList.add('in');t=true;}});
    return t;
  }
  revealCheck();
  addEventListener('scroll',revealCheck,{passive:true});
  addEventListener('resize',revealCheck);
  setTimeout(revealCheck,120);
  setTimeout(()=>rvEls.forEach(el=>el.classList.add('in')),2200); /* failsafe */

  /* parallax */
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(!reduce){
    const ph=[...document.querySelectorAll('[data-parallax]')];
    let tick=false;
    addEventListener('scroll',()=>{if(tick)return;tick=true;requestAnimationFrame(()=>{
      const vh=innerHeight;
      ph.forEach(p=>{const r=p.getBoundingClientRect();const c=r.top+r.height/2-vh/2;
        p.querySelector('img').style.transform='translateY('+(c*-0.045)+'px) scale(1.08)';});
      tick=false;});},{passive:true});
  }
})();
</script>
</body>
